</head>
<body>

  <nav class="nav">
    <a href="/" class="nav-name">Vishnu <span>Raveendran</span></a>
    <div class="nav-center">
      <div class="nav-dropdown" id="workDropdown">
        <button class="nav-dropdown-toggle" onclick="toggleDropdown()">
          Work <i class="ti ti-chevron-down"></i>
        </button>
        <div class="nav-dropdown-menu" id="dropdownMenu"></div>

  <div class="bg-grid" aria-hidden="true"></div>

    <button class="lightbox-prev" onclick="lightboxNav(-1)"><i class="ti ti-chevron-left"></i></button>
    <div class="lightbox-inner" id="lightboxInner"></div>
    <button class="lightbox-next" onclick="lightboxNav(1)"><i class="ti ti-chevron-right"></i></button>
